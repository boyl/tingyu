name: tingyu
description: 本地优先的 B 站音乐播放器。
publish_to: none
version: 0.1.29+30
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  crypto: ^3.0.6
  html: ^0.15.6
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  audio_session: ^0.2.2
  qr_flutter: ^4.1.0
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  url_launcher: ^6.3.2
  audio_metadata_reader: ^1.8.1
  file_selector: ^1.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/audio/wheel-tick.wav
    - assets/audio/LICENSE.txt
    - assets/audio/NOTICE.txt
    - assets/tray.png
    - assets/tray.ico
    - assets/branding/ribbon-outline.png
